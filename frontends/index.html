<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek-OCR WebUI v3.3.3</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/forms.css">
    <link rel="stylesheet" href="assets/css/results.css">
    <link rel="stylesheet" href="assets/css/logs.css">
</head>
<body>
    <!-- App Container -->
    <div class="app-container">
        <!-- Header will be injected by JavaScript -->
        <header class="header" id="header"></header>

        <!-- Main Content will be injected by JavaScript -->
        <main class="main-content" id="mainContent"></main>

        <!-- Footer will be injected by JavaScript -->
        <footer class="footer" id="footer"></footer>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <span class="toast-icon" id="toastIcon">✓</span>
        <span class="toast-message" id="toastMessage">操作成功</span>
    </div>

    <!-- JavaScript Files - Load in correct order -->
    <script src="../i18n.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/state.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/dom.js"></script>
    <script src="assets/js/templates.js"></script>
    <script src="assets/js/advanced-settings.js"></script>
    <script src="assets/js/validation.js"></script>
    <script src="assets/js/html-rendering.js"></script>
    <script src="assets/js/logs.js"></script>
    <script src="assets/js/toast.js"></script>
    <script src="assets/js/ui-handlers.js"></script>
    <script src="assets/js/file-upload.js"></script>
    <script src="assets/js/pdf-handler.js"></script>
    <script src="assets/js/image-processing.js"></script>
    <script src="assets/js/batch-processing.js"></script>
    <script src="assets/js/find-mode.js"></script>
    <script src="assets/js/mode-selector.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
